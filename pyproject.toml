[project]
name = "fin-analyst-agent"
version = "0.1.0"
description = "Agentic financial statement analyst: LangGraph orchestration, vault-driven skills, deterministic metrics."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2",
  "langchain-core>=1.7",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6",
  "claude-agent-sdk>=0.2",
  "guardrails-ai>=0.11",
  "httpx>=0.27",  # TypeSafe Jev client (fin_agent.evals)
]

[project.optional-dependencies]
# vn: vnstock is quarantined on PyPI (2026-11-04) and vnstock3 depends on the removed `vnai`; see README
api = ["anthropic>=0.40"]
dev = ["pytest>=8"]
# vault knowledge base (GraphRAG): local embeddings + Chroma. Install torch CPU-only first on Windows:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
kb = [
  "langchain-graph-retriever[chroma]>=0.8,<0.9",  # 0.8 needs the Chroma 1.x shim in fin_agent/knowledge/store.py
  "langchain-chroma>=1.1",
  "chromadb>=1.5",
  "langchain-huggingface>=1.2",
  "sentence-transformers>=5",
  "python-dateutil>=2.8.2,<3",  # chromadb pulls kubernetes (wants >=3); guardrails-ai needs <3 at runtime
]
ui = ["streamlit>=1.40"]
# step 4: google-adk

[project.scripts]
fin-agent = "fin_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fin_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
